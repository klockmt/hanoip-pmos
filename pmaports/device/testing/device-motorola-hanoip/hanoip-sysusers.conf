# hdshare keeps the 1000 it had on the 4.14: the files on the NAS disk (the Samba share) belong to that number, and the login
# user is 1001 (scripts/duranium-image).
g hdshare 1000
u hdshare 1000:1000 "NAS share (Samba)" /home/hdshare /sbin/nologin
# syncthing and adguardhome take the IDs the image gives them. Alpine's package scripts create them in the system range, where
# the 4.14's 105 and 106 are chrony and dnsmasq here, so a fixed number would collide. Their data is restored by name
# (scripts/restore-server) and Syncthing's folder on the NAS disk gets its owner fixed there.
u syncthing - "syncthing" /var/lib/syncthing /sbin/nologin
u adguardhome - "adguardhome" /var/lib/adguardhome /sbin/nologin
