# The service users of the 4.14 server with the IDs it gave them: what is on the NAS disk (Syncthing's folders, the Samba
# share) and in the restored data belongs to these numbers. The login user is 1001 (scripts/duranium-image), so hdshare keeps 1000.
g hdshare 1000
u hdshare 1000:1000 "NAS share (Samba)" /home/hdshare /sbin/nologin
g syncthing 108
u syncthing 105:108 "syncthing" /var/lib/syncthing /sbin/nologin
g adguardhome 109
u adguardhome 106:109 "adguardhome" /var/lib/adguardhome /sbin/nologin
