# The mainline root of the hanoip. usb0 is set up by /etc/local.d/10-hanoip-usb.start (the server's address and DHCP for
# the PC); NetworkManager must leave it alone. Wi-Fi power saving off: a server answers, it does not doze.
# The real MAC (ath10k picks a random one) is set in hanoip-ml-mac.conf, written on the phone by scripts/mainline-make-root.
[keyfile]
unmanaged-devices=interface-name:usb0

[device]
wifi.scan-rand-mac-address=no

[connection]
wifi.powersave=2
