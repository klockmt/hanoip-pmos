# The kernel may not write this phone's PMIC RTC (the SPMI arbiter refuses it), and once NTP is in sync it retries without
# end, a kernel log line each time. Unbind the driver: the RTC reads 1974 anyway and the clock comes from the network.
w- /sys/bus/platform/drivers/rtc-pm8xxx/unbind - - - - c440000.spmi:pmic@0:rtc@6000
