# The mainline root of the hanoip (docs/MAINLINE.md). Only udev's automatic loading is blocked; modprobe by name works.
# Loaded by /etc/init.d/hanoip-ml-modem, in order, once rmtfs and tqftpserv run:
blacklist qcom_pd_mapper
blacklist qcom_q6v5_pas
blacklist ipa
blacklist ath10k_snoc
# A headless server: no display, touch, video, camera, audio or Bluetooth (the panel goes dark once the bootloader's
# regulators are released).
blacklist msm
blacklist panel_ilitek_ili7807s
blacklist ilitek_hanoip_spi
blacklist venus_core
blacklist venus_dec
blacklist venus_enc
blacklist qcom_camss
blacklist hanoip_cam
blacklist hanoip_vcm
blacklist hci_uart
blacklist btqca
blacklist snd_soc_sm8250
blacklist snd_soc_wcd937x
blacklist snd_soc_wcd937x_sdw
